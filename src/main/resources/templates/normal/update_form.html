<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org" th:replace="normal/base::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>This is User Dashboard</title>
</head>
<body>
<section>
	<div class="card mr-3 ml-3">
			<div class="card-body">
				<h1 class="text-center">Update Contact</h1>
				<div class="container-fluid mt-1">
					<div class="row">
						<div class="col-md-8 offset-md-2">
							<form action="#" th:object="${contact}"
								enctype="multipart/form-data" method="POST"
								th:action="@{/user/process-update}" class="mt-2">
								
								<input type="hidden" th:value="${contact.cId}" name="cId" />

								<!-- First Name -->

								<div class="input-group">
									<div class="input-group-prepend">
										<div class="input-group-text mr-3">
											<i class="fa fa-plus"></i>
										</div>
									</div>
									<input th:value="${contact.name}" type="text" id="firstName" name="name"
										placeholder="Enter Name here" class="form-control" required />
								</div>

								<!-- Second Name -->

								<div class="input-group mt-3">
									<div class="input-group-prepend">
										<div class="input-group-text mr-3">
											<i class="fas fa-user-alt"></i>
										</div>
									</div>
									<input th:value="${contact.secondName}" type="text" id="SecondName" name="secondName"
										placeholder="Enter Nick Name here" class="form-control" required />
								</div>
								
								<!-- Phone --> 
								<div class="input-group mt-3">
									<div class="input-group-prepend">
										<div class="input-group-text mr-3">
											<i class="fa fa-phone"></i>
										</div>
									</div>
									<input th:value="${contact.phone}" min="10" type="number" id="phone" name="phone"
										placeholder="Enter phone number" class="form-control" required />
								</div>
								
								<!-- Email -->
								<div class="input-group mt-3">
									<div class="input-group-prepend">
										<div class="input-group-text mr-3">
										@
										</div>
									</div>
									<input th:value="${contact.email}" type="email" id="email" name="email"
										placeholder="Enter your email" class="form-control" required />
								</div>
								
								<!-- Work -->
								<div class="input-group mt-3">
									<div class="input-group-prepend">
										<div class="input-group-text mr-3">
										<i class="fa fa-briefcase"></i>
										</div>
									</div>
									<input th:value="${contact.work}" type="text" id="work" name="work"
										placeholder="Enter work here" class="form-control" required />
								</div>
								
								<!-- Form description -->
							<div class="input-group mt-3">
							<textarea th:text="${contact.description}" placeholder = "Enter contact description" name="description" id="description" class="form-control" rows="10" ></textarea>
							</div>
							
							<!-- Contact Image -->
							
							<div class="container text-center">
							<img style="width:250px; height:250px" class="img-fluid my_profile_pic" th:src="@{'/img/' + ${contact.image}}" alt="" />
							</div>
							<p>Choose the new profile pic</p>
							<div class="custom-file">
							<input type="file" name="profileImage" />
							</div>
							
							<div class="container text-center">
							<button class="btn btn-outline-primary">Save contact</button>
							</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
